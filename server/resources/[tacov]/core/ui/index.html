<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TacoV</title>
<style>
  /* Platzhalter-UI nach docs/design (V3 Gelb-Orange). Wird in Phase 3 durch die React-Oberfläche ersetzt. */
  :root { --accent: #FFD54A; --muted: #C9BFB0; --dim: #8F8578; --danger: #E8433A; --ok: #3FBF5F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, sans-serif; color: #fff; background: transparent; }
  body.open { background: radial-gradient(1200px 700px at 30% 20%, #3A3026 0%, #221C17 45%, #110E0B 100%); }
  #app { display: none; height: 100%; align-items: center; justify-content: center; }
  body.open #app { display: flex; }
  .panel { width: 720px; padding: 28px 32px; border-radius: 16px; background: rgba(12,10,8,0.86);
           box-shadow: inset 0 0 0 1px rgba(255,184,0,0.18), 0 20px 60px rgba(0,0,0,0.5); }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 900; letter-spacing: .04em; }
  h1 span { background: linear-gradient(90deg,#FFD54A,#FF9A1F,#F07A12); -webkit-background-clip: text; color: transparent; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .slot { padding: 18px; border-radius: 12px; background: rgba(255,255,255,0.03); box-shadow: inset 0 0 0 1px rgba(255,184,0,0.12); cursor: pointer; }
  .slot:hover { box-shadow: inset 0 0 0 1px rgba(255,184,0,0.5); }
  .slot.locked { opacity: .5; cursor: default; }
  .slot b { display: block; font-size: 16px; }
  .slot small { color: var(--muted); font-size: 12px; }
  form { display: none; margin-top: 18px; grid-template-columns: 1fr 1fr; gap: 10px; }
  form.show { display: grid; }
  input, select { padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,184,0,0.2); background: rgba(255,255,255,0.04); color: #fff; font: inherit; }
  button { grid-column: 1 / -1; padding: 12px; border: 0; border-radius: 10px; font-weight: 800; cursor: pointer;
           background: linear-gradient(90deg,#FFD54A,#FF9A1F,#F07A12); color: #1a120a; }
  #notify { position: fixed; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 10px 14px; border-radius: 10px; background: rgba(12,10,8,0.9); box-shadow: inset 0 0 0 1px rgba(255,184,0,0.18); font-size: 13px; }
  .toast.error { box-shadow: inset 0 0 0 1px var(--danger); }
  .toast.success { box-shadow: inset 0 0 0 1px var(--ok); }
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <h1><span>TacoV</span> · Charakterauswahl</h1>
    <div class="sub" id="sub"></div>
    <div class="slots" id="slots"></div>
    <form id="create">
      <input name="firstName" placeholder="Vorname" required>
      <input name="lastName" placeholder="Nachname" required>
      <input name="birthDate" type="date" required>
      <input name="origin" placeholder="Herkunft">
      <select name="gender"><option value="0">Männlich</option><option value="1">Weiblich</option></select>
      <button type="submit">Charakter anlegen</button>
    </form>
  </div>
</div>
<div id="notify"></div>
<script>
  const res = () => `https://${window.location.hostname}/`;
  const post = (name, body) => fetch(res() + name, { method: 'POST', body: JSON.stringify(body || {}) });

  function renderCharacters(data) {
    const slots = document.getElementById('slots');
    const form = document.getElementById('create');
    slots.innerHTML = '';
    form.classList.remove('show');
    const chars = data.characters || [];
    document.getElementById('sub').textContent = `${chars.length} von ${data.maxSlots} Plätzen belegt`;
    chars.forEach(c => {
      const d = document.createElement('div');
      d.className = 'slot';
      d.innerHTML = `<b>${c.first_name} ${c.last_name}</b><small>Level ${c.level_cache} · ${c.faction || 'Zivilist'}</small>`;
      d.onclick = () => post('selectCharacter', { id: c.id });
      slots.appendChild(d);
    });
    for (let i = chars.length; i < data.maxSlots; i++) {
      const locked = i >= 1 && (data.maxLevel || 0) < data.secondSlotLevel;
      const d = document.createElement('div');
      d.className = 'slot' + (locked ? ' locked' : '');
      d.innerHTML = locked
        ? `<b>Gesperrt</b><small>Zweiter Platz ab Level ${data.secondSlotLevel}</small>`
        : `<b>Neuer Charakter</b><small>Platz ${i + 1}</small>`;
      if (!locked) d.onclick = () => form.classList.add('show');
      slots.appendChild(d);
    }
  }

  document.getElementById('create').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    post('createCharacter', Object.fromEntries(f.entries()));
  });

  function toast(kind, text) {
    const t = document.createElement('div');
    t.className = 'toast ' + kind; t.textContent = text;
    document.getElementById('notify').appendChild(t);
    setTimeout(() => t.remove(), 5000);
  }

  window.addEventListener('message', ({ data: msg }) => {
    if (msg.action === 'open') {
      document.body.classList.add('open');
      if (msg.data.view === 'characters') renderCharacters(msg.data.data);
    } else if (msg.action === 'close') {
      document.body.classList.remove('open');
    } else if (msg.action === 'notify') {
      toast(msg.data.kind, msg.data.text);
    }
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') post('close'); });
</script>
</body>
</html>
